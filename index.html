var KEY='pedido-rosilda-2026-11-17';
var st={q:{},off:{},extra:''};
try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.q)st=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function qty(it){return st.q[it.id]!=null?st.q[it.id]:it.qty;}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(){
  var h='',cat='';
  ITEMS.forEach(function(it){
    if(it.cat!==cat){cat=it.cat;h+='<h2>'+esc(cat)+'</h2>';}
    h+='<div class="card" id="c-'+it.id+'"><div class="top">'+
      (it.img?'<img src="'+it.img+'" alt="">':'')+
      '<div><div class="name">'+esc(it.name)+'</div>'+
      (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+
      '<div class="changed"></div><div class="offlabel">Item tirado do pedido</div></div></div>'+
      '<div class="ctrl"><button class="menos" type="button" aria-label="menos">−</button>'+
      '<span class="qty"></span><button class="mais" type="button" aria-label="mais">+</button>'+
      '<button class="tirar" type="button">Tirar</button></div></div>';
  });
  document.getElementById('lista').innerHTML=h;
  ITEMS.forEach(function(it){
    var c=document.getElementById('c-'+it.id);
    c.querySelector('.menos').onclick=function(){var v=qty(it);if(v>1){st.q[it.id]=v-1;save();upd(it);}};
    c.querySelector('.mais').onclick=function(){st.q[it.id]=qty(it)+1;save();upd(it);};
    c.querySelector('.tirar').onclick=function(){st.off[it.id]=!st.off[it.id];save();upd(it);};
    upd(it);
  });
}
function upd(it){
  var c=document.getElementById('c-'+it.id),v=qty(it),off=!!st.off[it.id];
  c.querySelector('.qty').textContent=v;
  c.classList.toggle('off',off);
  c.querySelector('.tirar').textContent=off?'Voltar':'Tirar';
  c.querySelector('.changed').textContent=(!off&&v!==it.qty)?'Antes: '+it.qty+' → agora: '+v:'';
}
function mensagem(){
  var mud=[],tir=[],add=[];
  ITEMS.forEach(function(it){
    if(st.off[it.id])tir.push('Tirar: '+it.name);
    else if(qty(it)!==it.qty)mud.push('Mudar: '+it.name+' de '+it.qty+' para '+qty(it));
  });
  (st.extra||'').split('\n').forEach(function(l){l=l.trim();if(l)add.push('Adicionar: '+l);});
  var all=mud.concat(tir,add);
  if(!all.length)return 'Pedido confirmado sem alterações';
  return 'Alterações no pedido:\n'+all.join('\n');
}
var ta=document.getElementById('extra');
ta.value=st.extra||'';
ta.oninput=function(){st.extra=ta.value;save();};
document.getElementById('enviar').onclick=function(){
  window.location.href='https://wa.me/?text='+encodeURIComponent(mensagem());
};
render();
</script>
